# Fork PET Saúde: imagem única amd64 publicada em GHCR. Base upstream v0.6.36.
# PR: build + smoke test, sem push. main e tags v*: build, push e smoke test.
name: docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/petsaude-uninove/open-webui

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço no runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test da imagem
        run: |
          set -euo pipefail
          tag="$(echo "${{ steps.meta.outputs.tags }}" | head -1)"
          docker run -d --name owui -p 18080:8080 -e WEBUI_SECRET_KEY=smoke "$tag"
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then echo "health ok"; docker rm -f owui; exit 0; fi
            sleep 5
          done
          docker logs --tail 100 owui; docker rm -f owui; exit 1
